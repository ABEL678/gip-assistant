services:
  # ============ PostgreSQL 15 ============
  db:
    image: mirror.gcr.io/library/postgres:15-alpine
    container_name: gip_db
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-gip_assistant}
      POSTGRES_USER: ${DB_USER:-gip}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gip}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "0.0.0.0:5555:5432"

  # ============ FastAPI backend ============
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: gip_backend
    env_file: ../.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ============ Excel worker ============
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: gip_worker
    command: python -m backend.worker.excel_worker
    env_file: ../.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: